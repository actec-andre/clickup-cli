[project]
name = "clickup-cli"
version = "0.1.0"
description = "LLM-first exec CLI for the ClickUp API v2 (self-contained, sync client)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andre Kremer", email = "andre@solarcraft.gmbh" }]
keywords = ["clickup", "cli", "api", "automation", "llm", "exec"]
dependencies = ["httpx>=0.27,<1", "click>=8.1,<9", "rich>=13,<15", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22", "ruff>=0.4"]

[project.scripts]
clickup-cli = "clickup_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clickup_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
